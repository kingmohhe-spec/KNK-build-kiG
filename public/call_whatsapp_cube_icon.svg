<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Cube icon with Call and WhatsApp logos split diagonally</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A 3D isometric cube showing the left face with a phone/call symbol and the right face with the WhatsApp logo, split diagonally</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <!-- Left face clip (call side - blue) -->
    <clipPath id="leftFaceClip">
      <polygon points="340,120 180,210 180,390 340,300"/>
    </clipPath>

    <!-- Right face clip (whatsapp side - green) -->
    <clipPath id="rightFaceClip">
      <polygon points="340,120 500,210 500,390 340,300"/>
    </clipPath>

    <!-- Top face clip -->
    <clipPath id="topFaceClip">
      <polygon points="340,60 500,150 340,240 180,150"/>
    </clipPath>

    <!-- Inner shadow for top face -->
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Left face depth gradient -->
    <linearGradient id="leftDepth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Right face depth gradient -->
    <linearGradient id="rightDepth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Soft drop shadow -->
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- DROP SHADOW ellipse -->
  <ellipse cx="340" cy="418" rx="128" ry="18" fill="#000" opacity="0.13" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.13;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- === LEFT FACE — Call (deep blue) === -->
  <polygon points="340,120 180,210 180,390 340,300" fill="#1A73E8" style="fill:rgb(26, 115, 232);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Call icon on left face — phone handset SVG drawn in isometric space -->
  <!-- We draw in a local coordinate system and use a group with transform to place it on the left face -->
  <!-- Left face center approx: x=260, y=255 -->
  <g clip-path="url(#leftFaceClip)" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
    <!-- Shading overlay -->
    <polygon points="340,120 180,210 180,390 340,300" fill="url(#leftDepth)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

    <!-- Phone handset icon, centered on left face using transform -->
    <!-- Left face is a parallelogram, center ~(255, 253) -->
    <!-- We draw a simplified phone icon using paths, scaled and positioned -->
    <g transform="translate(255,253) rotate(-15) scale(1,1)" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
      <!-- Phone body (rounded rect approximation using path) -->
      <!-- Simplified handset shape: an S-curve -->
      <path d="&#10;        M -22 -28&#10;        C -22 -38, -10 -42, -4 -36&#10;        L 2 -28&#10;        C 6 -22, 2 -16, -4 -14&#10;        L -8 -12&#10;        C -10 -11, -10 -9, -8 -6&#10;        L 10 14&#10;        C 12 17, 14 17, 16 16&#10;        L 20 12&#10;        C 26 6, 34 9, 38 16&#10;        L 44 26&#10;        C 50 36, 44 48, 34 48&#10;        C 22 48, 2 40, -12 26&#10;        C -26 12, -36 -8, -36 -20&#10;        C -36 -30, -30 -38, -22 -40&#10;        Z&#10;      " fill="white" opacity="0.97" transform="scale(0.72)" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.97;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    </g>

    <!-- Highlight strip on left face edge -->
    <line x1="340" y1="120" x2="340" y2="300" stroke="white" stroke-width="0.5" opacity="0.3" style="fill:rgb(0, 0, 0);stroke:rgb(255, 255, 255);color:rgb(255, 255, 255);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.3;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  </g>

  <!-- === RIGHT FACE — WhatsApp (green) === -->
  <polygon points="340,120 500,210 500,390 340,300" fill="#25D366" style="fill:rgb(37, 211, 102);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <g clip-path="url(#rightFaceClip)" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
    <!-- Shading overlay -->
    <polygon points="340,120 500,210 500,390 340,300" fill="url(#rightDepth)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

    <!-- WhatsApp icon: white circle with WA speech bubble -->
    <!-- Right face center approx: x=422, y=253 -->
    <g transform="translate(425,255) rotate(15) scale(1,1)" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
      <!-- White circle background -->
      <circle cx="0" cy="0" r="36" fill="white" opacity="0.97" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.97;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
      <!-- WA logo: green speech bubble with phone icon inside -->
      <!-- Speech bubble path -->
      <path d="&#10;        M 0 -26&#10;        C 14 -26, 26 -14, 26 0&#10;        C 26 10, 20 19, 10 23&#10;        L 14 32&#10;        L 0 26&#10;        C -14 26, -26 14, -26 0&#10;        C -26 -14, -14 -26, 0 -26&#10;        Z&#10;      " fill="#25D366" style="fill:rgb(37, 211, 102);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
      <!-- Little phone inside speech bubble (white) -->
      <path d="&#10;        M -10 -12&#10;        C -10 -16, -6 -18, -3 -15&#10;        L 0 -11&#10;        C 2 -9, 0 -6, -2 -5&#10;        L -4 -5&#10;        C -5 -4, -5 -3, -4 -2&#10;        L 6 8&#10;        C 7 9, 8 9, 9 8&#10;        L 11 6&#10;        C 14 3, 17 5, 18 8&#10;        L 20 12&#10;        C 22 16, 18 20, 14 20&#10;        C 8 20, -2 16, -8 10&#10;        C -14 4, -18 -4, -18 -8&#10;        C -18 -12, -14 -16, -10 -14&#10;        Z&#10;      " fill="white" transform="scale(0.62)" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    </g>
  </g>

  <!-- === TOP FACE — light tinted === -->
  <polygon points="340,60 500,150 340,240 180,150" fill="#e8f4fd" style="fill:rgb(232, 244, 253);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <polygon points="340,60 500,150 340,240 180,150" fill="url(#topGrad)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- === CUBE EDGES (crisp outlines) === -->
  <!-- Left face outline -->
  <polygon points="340,120 180,210 180,390 340,300" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round" opacity="0.55" style="fill:none;stroke:rgb(255, 255, 255);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:round;opacity:0.55;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Right face outline -->
  <polygon points="340,120 500,210 500,390 340,300" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round" opacity="0.45" style="fill:none;stroke:rgb(255, 255, 255);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:round;opacity:0.45;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Top face outline -->
  <polygon points="340,60 500,150 340,240 180,150" fill="none" stroke="white" stroke-width="1.8" stroke-linejoin="round" opacity="0.7" style="fill:none;stroke:rgb(255, 255, 255);color:rgb(255, 255, 255);stroke-width:1.8px;stroke-linecap:butt;stroke-linejoin:round;opacity:0.7;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Vertical center edge (between two faces) -->
  <line x1="340" y1="120" x2="340" y2="300" stroke="white" stroke-width="2" opacity="0.6" style="fill:rgb(0, 0, 0);stroke:rgb(255, 255, 255);color:rgb(255, 255, 255);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Bottom left edge -->
  <line x1="180" y1="390" x2="340" y2="480" stroke="#b0c4d8" stroke-width="1.2" opacity="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(176, 196, 216);color:rgb(255, 255, 255);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Bottom right edge -->
  <line x1="500" y1="390" x2="340" y2="480" stroke="#8dc8a0" stroke-width="1.2" opacity="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(141, 200, 160);color:rgb(255, 255, 255);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Bottom center point -->
  <line x1="340" y1="300" x2="340" y2="480" stroke="white" stroke-width="1.2" opacity="0.35" style="fill:rgb(0, 0, 0);stroke:rgb(255, 255, 255);color:rgb(255, 255, 255);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.35;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Bottom faces (closing the cube bottom) -->
  <polygon points="340,480 180,390 340,300" fill="#1558c0" opacity="0.75" style="fill:rgb(21, 88, 192);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.75;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <polygon points="340,480 500,390 340,300" fill="#1aab52" opacity="0.75" style="fill:rgb(26, 171, 82);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.75;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Labels -->
  <text font-family="'Anthropic Sans', sans-serif" font-size="13" font-weight="500" fill="#1A73E8" text-anchor="middle" x="175" y="450" style="fill:rgb(26, 115, 232);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:auto">Call</text>
  <text font-family="'Anthropic Sans', sans-serif" font-size="13" font-weight="500" fill="#25D366" text-anchor="middle" x="505" y="450" style="fill:rgb(37, 211, 102);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:auto">WhatsApp</text>
</svg>